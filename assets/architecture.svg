<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="AegisNet architecture: telemetry, features, two brains, fusion, then explain, guardian and drift outputs" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00F0C8"/></marker></defs>
<style>.fl{stroke-dasharray:7 7;animation:d 1.1s linear infinite}@keyframes d{to{stroke-dashoffset:-28}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1!important}}</style>
<rect width="1200" height="420" rx="20" fill="#0A0F1F"/>
<text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#E8EEFF">The Dual-Brain architecture</text>
<rect x="30" y="150" width="150" height="110" rx="14" fill="#121B33" stroke="#00F0C8" stroke-width="2.5"/><text x="105.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#00F0C8">Telemetry</text><text x="105.0" y="206" text-anchor="middle" font-size="14" fill="#E8EEFF">13 server</text><text x="105.0" y="226" text-anchor="middle" font-size="14" fill="#E8EEFF">metrics / minute</text><rect x="230" y="150" width="150" height="110" rx="14" fill="#121B33" stroke="#00F0C8" stroke-width="2.5"/><text x="305.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#00F0C8">Features</text><text x="305.0" y="206" text-anchor="middle" font-size="14" fill="#E8EEFF">26 inputs:</text><text x="305.0" y="226" text-anchor="middle" font-size="14" fill="#E8EEFF">level + change</text>
<rect x="450" y="70" width="230" height="120" rx="14" fill="#121B33" stroke="#8B7BFF" stroke-width="2.5"/><text x="565.0" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#8B7BFF">BRAIN 1: Autoencoder</text><text x="565.0" y="126" text-anchor="middle" font-size="14" fill="#E8EEFF">26-18-6-18-26</text><text x="565.0" y="146" text-anchor="middle" font-size="14" fill="#E8EEFF">learns NORMAL only</text><text x="565.0" y="166" text-anchor="middle" font-size="14" fill="#E8EEFF">finds unknown threats</text>
<rect x="450" y="225" width="230" height="120" rx="14" fill="#121B33" stroke="#FFB020" stroke-width="2.5"/><text x="565.0" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#FFB020">BRAIN 2: Classifier</text><text x="565.0" y="281" text-anchor="middle" font-size="14" fill="#E8EEFF">26-48-24-7</text><text x="565.0" y="301" text-anchor="middle" font-size="14" fill="#E8EEFF">learns labelled attacks</text><text x="565.0" y="321" text-anchor="middle" font-size="14" fill="#E8EEFF">names known threats</text>
<rect x="740" y="150" width="150" height="110" rx="14" fill="#121B33" stroke="#FF3D71" stroke-width="2.5"/><text x="815.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#FF3D71">FUSION</text><text x="815.0" y="206" text-anchor="middle" font-size="14" fill="#E8EEFF">risk 0-100</text><text x="815.0" y="226" text-anchor="middle" font-size="14" fill="#E8EEFF">+ signature check</text>
<rect x="950" y="50" width="220" height="90" rx="14" fill="#121B33" stroke="#3DDC97" stroke-width="2.5"/><text x="1060.0" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#3DDC97">Explain</text><text x="1060.0" y="106" text-anchor="middle" font-size="14" fill="#E8EEFF">which metrics caused it</text><rect x="950" y="160" width="220" height="90" rx="14" fill="#121B33" stroke="#3DDC97" stroke-width="2.5"/><text x="1060.0" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#3DDC97">Guardian agent</text><text x="1060.0" y="216" text-anchor="middle" font-size="14" fill="#E8EEFF">safe actions auto-run</text><text x="1060.0" y="236" text-anchor="middle" font-size="14" fill="#E8EEFF">risky ones need a human</text><rect x="950" y="270" width="220" height="90" rx="14" fill="#121B33" stroke="#3DDC97" stroke-width="2.5"/><text x="1060.0" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#3DDC97">Drift watchdog</text><text x="1060.0" y="326" text-anchor="middle" font-size="14" fill="#E8EEFF">PSI says when to retrain</text>
<path class="fl" d="M180 205H228" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path class="fl" d="M380 205C415 205 415 130 448 130" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path class="fl" d="M380 205C415 205 415 285 448 285" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path class="fl" d="M680 130C715 130 715 195 738 195" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path class="fl" d="M680 285C715 285 715 220 738 220" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path class="fl" d="M890 190C920 190 920 95 948 95" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path class="fl" d="M890 205H948" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><path class="fl" d="M890 220C920 220 920 315 948 315" stroke="#00F0C8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="600" y="395" text-anchor="middle" font-size="15" fill="#7F8DB3">Brain 1 never sees an attack, so it flags anything strange. Brain 2 names the known ones. Fusion refuses to guess a name for new patterns.</text></svg>