<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Zero-day experiment: unseen ransomware" font-family="'Segoe UI',Helvetica,Arial,sans-serif"><style>.b{transform-box:fill-box;transform-origin:left;animation:g 1.2s ease-out both}@keyframes g{from{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1!important}}</style><rect width="1000" height="400" rx="20" fill="#0A0F1F"/><text x="30" y="44" font-size="22" font-weight="700" fill="#E8EEFF">Zero-day test: ransomware was hidden from training</text><text x="30" y="102" font-size="16" fill="#E8EEFF">Classifier alone flags it</text><rect x="400" y="80" width="430" height="30" rx="8" fill="#121B33"/><rect class="b" style="animation-delay:0.00s" x="400" y="80" width="0" height="30" rx="8" fill="#7F8DB3"/><text x="412" y="102" font-size="18" font-weight="800" fill="#7F8DB3">0%</text><text x="30" y="158" font-size="16" fill="#E8EEFF">Autoencoder alone flags it</text><rect x="400" y="136" width="430" height="30" rx="8" fill="#121B33"/><rect class="b" style="animation-delay:0.15s" x="400" y="136" width="430" height="30" rx="8" fill="#8B7BFF"/><text x="842" y="158" font-size="18" font-weight="800" fill="#8B7BFF">100%</text><text x="30" y="214" font-size="16" fill="#E8EEFF">AegisNet flags it</text><rect x="400" y="192" width="430" height="30" rx="8" fill="#121B33"/><rect class="b" style="animation-delay:0.30s" x="400" y="192" width="430" height="30" rx="8" fill="#00F0C8"/><text x="842" y="214" font-size="18" font-weight="800" fill="#00F0C8">100%</text><text x="30" y="270" font-size="16" fill="#E8EEFF">AegisNet calls it a NEW pattern</text><rect x="400" y="248" width="430" height="30" rx="8" fill="#121B33"/><rect class="b" style="animation-delay:0.45s" x="400" y="248" width="430" height="30" rx="8" fill="#FFB020"/><text x="842" y="270" font-size="18" font-weight="800" fill="#FFB020">100%</text><text x="30" y="326" font-size="16" fill="#E8EEFF">AegisNet mislabels it as a known attack</text><rect x="400" y="304" width="430" height="30" rx="8" fill="#121B33"/><rect class="b" style="animation-delay:0.60s" x="400" y="304" width="0" height="30" rx="8" fill="#FF3D71"/><text x="412" y="326" font-size="18" font-weight="800" fill="#FF3D71">0%</text><text x="30" y="382" font-size="14" fill="#7F8DB3">A classifier cannot recognise what it was never shown. The autoencoder only needs to know what normal looks like.</text></svg>